name: Admissions and MySQL

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  admissions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: learning_test_integration
          MYSQL_USER: learning_fixture
          MYSQL_PASSWORD: suite-local-fixture-only
          MYSQL_ROOT_PASSWORD: suite-local-root-only
        ports:
          - 33126:3306
        options: >-
          --health-cmd="mysql --protocol=tcp -h 127.0.0.1 -u learning_fixture -psuite-local-fixture-only learning_test_integration -e 'SELECT 1'"
          --health-interval=4s --health-timeout=5s --health-retries=30
    env:
      LEARNING_DSN: mysql:host=127.0.0.1;port=33126;dbname=learning_test_integration;charset=utf8mb4
      LEARNING_DB_USER: learning_fixture
      LEARNING_DB_PASSWORD: suite-local-fixture-only
      LEARNING_COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Check the schema and application sources
        run: |
          find src bin public tests -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check public/workspace.js
          node --check public/enterprise.js
          node --check public/study.js
          node --check public/coursework.js
          node --check public/exams.js
          node --check public/credentials.js
          node --check public/verify.js
          node --check public/transfers.js
          node --check public/learning-paths.js
          node --check public/reports.js
          composer validate --no-check-publish --no-interaction
          php bin/learning.php migrate
          php bin/learning.php migrate | grep -Fx '{"applied":[]}'
          php bin/learning.php health
      - name: Exercise HTTP and independent MySQL transactions
        run: |
          mkdir -p storage
          php -S 127.0.0.1:8088 -t public public/index.php > storage/php.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 12 --retry-connrefused http://127.0.0.1:8088/healthz | grep -Fx '{"ready":true}'
          python3 tests/admission_http.py http://127.0.0.1:8088
          python3 tests/admission_concurrency.py
          python3 tests/enterprise_seats.py http://127.0.0.1:8088
          python3 tests/study_http.py http://127.0.0.1:8088
          python3 tests/transfers_http.py http://127.0.0.1:8088
          python3 tests/coursework_http.py http://127.0.0.1:8088
          python3 tests/exams_http.py http://127.0.0.1:8088
          python3 tests/credentials_http.py http://127.0.0.1:8088
          python3 tests/paths_reports_http.py http://127.0.0.1:8088
      - name: Read the HTTP log on failure
        if: failure()
        run: test ! -f storage/php.log || cat storage/php.log

  self-hosted-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LEARNING_DB_NAME: learning_demo_ci
      LEARNING_DB_PASSWORD: compose-local-fixture-only
      LEARNING_MYSQL_ROOT_PASSWORD: compose-local-root-only
      LEARNING_COOKIE_SECURE: "0"
      LEARNING_HTTP_PORT: "8088"
      LEARNING_SWEEP_INTERVAL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and start the published deployment
        run: |
          docker compose build migrate
          docker compose up --wait --wait-timeout 150
          curl --fail --silent http://127.0.0.1:8088/healthz | grep -Fx '{"ready":true}'
          curl --fail --silent http://127.0.0.1:8088/verify | grep -q 'verification-form'
          curl --fail --silent http://127.0.0.1:8088/workspace.js | grep 'showCohorts' >/dev/null
      - name: Replay the installation walkthrough
        run: openssl rand -hex 24 | python3 examples/harbor_demo.py http://127.0.0.1:8088 --compose
      - name: Confirm the migration and background processes use the application
        run: |
          docker compose exec -T web php bin/learning.php migrate | grep -Fx '{"applied":[]}'
          docker compose logs worker | grep -F '"exam_attempts_finalized"'
          docker compose logs worker | grep -F '"retraining_tasks_created"'
      - name: Read deployment logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the isolated runner deployment
        if: always()
        run: docker compose down --volumes
