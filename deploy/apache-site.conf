<VirtualHost *:80>
    DocumentRoot /var/www/learning-cloud/public
    DirectoryIndex index.php

    <Directory /var/www/learning-cloud/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
